
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }

    h2 {
      margin-bottom: 20px;
    }

    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
    }

    input, textarea, button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    
    #successModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    #successModalContent {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      width: 300px;
      text-align: center;
      border-radius: 8px;
    }

    #closeModalBtn {
      margin-top: 10px;
      padding: 6px 12px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    #closeModalBtn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Upload a Video</h2>
  <form id="uploadForm">
    <input type="file" id="file" name="video" accept="video/*" required />
    <input type="text" id="title" name="title" placeholder="Video Title" required />
    <textarea id="description" name="description" placeholder="Video Description" required></textarea>
    <button type="submit">Upload</button>
  </form>

  <div id="successModal">
    <div id="successModalContent">
      <h4>Upload successful!</h4>
      <button id="closeModalBtn">Close</button>
    </div>
  </div>

  <script src="upload.js"></script>
</body>
</html>
